<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>احتفال التخرج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy-deep: #0a1a3f;
            --gold: #fbbf24;
            --gold-bright: #fcd34d;
            --gold-deep: #d97706;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(ellipse at center, #1e3a8a 0%, var(--navy-deep) 100%);
            color: white;
            overflow: hidden;
            min-height: 100vh;
        }

        /* ===== شاشة العداد التنازلي ===== */
        .countdown-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
            background: radial-gradient(ellipse at center, #1e3a8a 0%, var(--navy-deep) 100%);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .countdown-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .countdown-title {
            font-family: 'Cairo', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 3rem;
            letter-spacing: 4px;
            opacity: 0.9;
            text-align: center;
            padding: 0 1rem;
        }

        .countdown-title .cap {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            animation: cap-float 2.5s ease-in-out infinite;
        }

        @keyframes cap-float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }

        .countdown-number {
            font-family: 'Cairo', sans-serif;
            font-size: clamp(8rem, 25vw, 16rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 50%, var(--gold-deep) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 80px rgba(251, 191, 36, 0.6);
            animation: number-pop 1s ease-out;
            line-height: 1;
            filter: drop-shadow(0 10px 40px rgba(251, 191, 36, 0.5));
        }

        @keyframes number-pop {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .countdown-ring {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 3px solid rgba(251, 191, 36, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: ring-spin 1s linear infinite;
            max-width: 80vw;
            max-height: 80vw;
        }

        @keyframes ring-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .countdown-ring.outer {
            width: 500px;
            height: 500px;
            border-color: rgba(251, 191, 36, 0.1);
            border-bottom-color: rgba(251, 191, 36, 0.5);
            animation-direction: reverse;
            animation-duration: 1.5s;
            max-width: 90vw;
            max-height: 90vw;
        }

        /* ===== صفحة الفيديو ===== */
        .video-page {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 2rem 1rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
            z-index: 10;
        }

        .video-page.show {
            opacity: 1;
            visibility: visible;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-family: 'Cairo', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
        }

        .page-subtitle {
            font-family: 'Cairo', sans-serif;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* إطار الفيديو */
        .video-frame {
            position: relative;
            width: 100%;
            max-width: 900px;
            border-radius: 24px;
            overflow: hidden;
            background: black;
            box-shadow:
                0 0 0 2px rgba(251, 191, 36, 0.4),
                0 0 0 10px rgba(251, 191, 36, 0.1),
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(251, 191, 36, 0.2);
            transition: transform 0.4s ease;
        }

        .video-frame:hover {
            transform: translateY(-5px);
        }

        video {
            display: block;
            width: 100%;
            max-height: 70vh;
            background: black;
        }

        /* زخارف الزوايا */
        .corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 3px solid var(--gold);
            z-index: 5;
            pointer-events: none;
            opacity: 0.8;
            transition: all 0.4s ease;
        }

        .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-top-right-radius: 12px; }
        .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-bottom-left-radius: 12px; }
        .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

        .video-frame:hover .corner {
            opacity: 1;
            width: 65px;
            height: 65px;
        }

        /* زر التشغيل الكبير */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: rgba(251, 191, 36, 0.95);
            color: var(--navy-deep);
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(251, 191, 36, 0.6);
            transition: all 0.3s ease;
            z-index: 6;
            padding-right: 8px;
        }

        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: var(--gold-bright);
            box-shadow: 0 15px 50px rgba(251, 191, 36, 0.8);
        }

        .play-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5);
        }

        /* شارة HD */
        .video-badge {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(10, 26, 63, 0.85);
            backdrop-filter: blur(10px);
            color: var(--gold);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: 1px solid rgba(251, 191, 36, 0.4);
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .video-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* رسالة عدم وجود الفيديو */
        .video-message {
            display: none;
            padding: 4rem 2rem;
            text-align: center;
            color: white;
        }

        .video-message.show {
            display: block;
        }

        .message-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .message-title {
            font-family: 'Cairo', sans-serif;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .message-text {
            color: rgba(255, 255, 255, 0.8);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .message-text code {
            background: rgba(251, 191, 36, 0.15);
            color: var(--gold);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            direction: ltr;
            display: inline-block;
        }

        /* الكونفيتي */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            top: -20px;
            opacity: 0;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.7;
            }
        }

        /* تذييل بسيط */
        .page-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-family: 'Cairo', sans-serif;
        }

        .page-footer .cap {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            display: inline-block;
        }

        /* استجابة الجوال */
        @media (max-width: 768px) {
            .countdown-title {
                font-size: 1.3rem;
                margin-bottom: 2rem;
            }

            .countdown-title .cap {
                font-size: 2.5rem;
            }

            .corner {
                width: 35px;
                height: 35px;
            }

            .play-btn {
                width: 70px;
                height: 70px;
                font-size: 1.5rem;
            }

            .video-badge {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- شاشة العداد التنازلي -->
    <div class="countdown-screen" id="countdownScreen">
        <div class="countdown-title">
            <span class="cap">🎓</span>
            استعد للحظة المنتظرة
        </div>
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
            <div class="countdown-ring outer"></div>
            <div class="countdown-ring"></div>
            <div class="countdown-number" id="countdownNumber" key="5">5</div>
        </div>
    </div>

    <!-- حاوية الكونفيتي -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- صفحة الفيديو -->
    <div class="video-page" id="videoPage">
        <div class="page-header">
            <h1 class="page-title">احتفال التخرج🎓قسم الفيزياء الطبية </h1>
            <div class="page-subtitle">دفعة ٢٠٢6</div>
        </div>

        <div class="video-frame" id="videoFrame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="video-badge">
                <span>HD • ذكريات</span>
            </div>

            <video id="graduationVideo" preload="metadata" playsinline controls>
                <source src="graduation-video.mp4" type="video/mp4">
                <source src="video.mp4" type="video/mp4">
                <source src="graduation-video.mov" type="video/quicktime">
                <source src="graduation-video.webm" type="video/webm">
            </video>

            <button class="play-btn" id="playBtn" aria-label="تشغيل">▶</button>

            <div class="video-message" id="videoMessage">
                <div class="message-icon">🎬</div>
                <div class="message-title">الفيديو غير موجود</div>
                <div class="message-text">
                    ضع ملف الفيديو في نفس المجلد باسم:
                    <code>graduation-video.mp4</code>
                    <br><br>
                    ثم أعد فتح الصفحة.
                </div>
            </div>
        </div>

        <div class="page-footer">
            <span class="cap">🎓</span><br>
            مبروك التخرج
        </div>
    </div>

    <script>
        // ====== العداد التنازلي 5 → 1 ======
        const countdownScreen = document.getElementById('countdownScreen');
        const countdownNumber = document.getElementById('countdownNumber');
        const videoPage = document.getElementById('videoPage');
        let currentCount = 5;

        function updateCountdown() {
            if (currentCount > 0) {
                countdownNumber.textContent = currentCount;
                // إعادة تشغيل الأنيميشن
                countdownNumber.style.animation = 'none';
                countdownNumber.offsetHeight; // إعادة التدفق
                countdownNumber.style.animation = 'number-pop 1s ease-out';
                currentCount--;
                setTimeout(updateCountdown, 1000);
            } else {
                // انتهى العداد — عرض رسالة "استعد!"
                countdownNumber.textContent = '🎉';
                countdownNumber.style.animation = 'none';
                countdownNumber.offsetHeight;
                countdownNumber.style.animation = 'number-pop 1s ease-out';

                // إطلاق الكونفيتي
                celebrateBurst();

                // إخفاء شاشة العداد وعرض الفيديو
                setTimeout(() => {
                    countdownScreen.classList.add('hidden');
                    videoPage.classList.add('show');
                }, 1000);
            }
        }

        // بدء العداد بعد تحميل الصفحة
        window.addEventListener('load', () => {
            setTimeout(updateCountdown, 500);
        });

        // ====== الكونفيتي ======
        function celebrateBurst() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#fbbf24', '#fcd34d', '#3b5bdb', '#ffffff', '#d97706', '#fef9e7'];

            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                confetti.style.width = (Math.random() * 8 + 8) + 'px';
                confetti.style.height = confetti.style.width;
                container.appendChild(confetti);

                // إزالة بعد انتهاء الأنيميشن
                setTimeout(() => confetti.remove(), 6000);
            }
        }

        // ====== تشغيل الفيديو ======
        const video = document.getElementById('graduationVideo');
        const playBtn = document.getElementById('playBtn');
        const videoMessage = document.getElementById('videoMessage');

        let videoLoaded = false;

        // نجاح تحميل الفيديو
        video.addEventListener('loadedmetadata', () => {
            videoLoaded = true;
            playBtn.style.display = 'flex';
            videoMessage.classList.remove('show');
            console.log('✓ الفيديو جاهز');
        });

        // فشل تحميل جميع المصادر
        video.addEventListener('error', () => {
            videoLoaded = false;
            playBtn.style.display = 'none';
            videoMessage.classList.add('show');
            console.log('✗ الفيديو غير متاح');
        });

        // مهلة أمان: بعد 5 ثوانٍ من بدء صفحة الفيديو، تحقق
        setTimeout(() => {
            if (!videoLoaded && videoPage.classList.contains('show')) {
                playBtn.style.display = 'none';
                videoMessage.classList.add('show');
            }
        }, 8000);

        // زر التشغيل
        playBtn.addEventListener('click', () => {
            if (videoLoaded) {
                video.play();
                celebrateBurst();
            }
        });

        video.addEventListener('play', () => {
            playBtn.classList.add('hidden');
        });

        video.addEventListener('pause', () => {
            playBtn.classList.remove('hidden');
        });

        // النقر على الفيديو نفسه
        video.addEventListener('click', () => {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>
</body>
</html>
